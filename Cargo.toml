[package]
name = "duroxide-mysql-tidb"
version = "0.1.1"
authors = ["mingley"]
edition = "2024"
rust-version = "1.94"
description = "MySQL 8.0+ and TiDB storage provider for Duroxide durable execution"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mingley/duroxide-mysql-tidb"
homepage = "https://github.com/mingley/duroxide-mysql-tidb"
documentation = "https://docs.rs/duroxide-mysql-tidb"
readme = "README.md"
publish = true
exclude = [
    ".github/",
    "scripts/",
    "tests/",
]
keywords = ["duroxide", "mysql", "tidb", "workflow", "durable-execution"]
categories = ["database", "asynchronous", "concurrency"]

[package.metadata.docs.rs]
features = ["tls-rustls-ring", "mysql-rsa", "memory"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["tls-rustls-ring", "mysql-rsa"]
tls-rustls-ring = ["sqlx/tls-rustls-ring"]
tls-rustls-aws-lc-rs = ["sqlx/tls-rustls-aws-lc-rs"]
tls-native = ["sqlx/tls-native-tls"]
mysql-rsa = ["sqlx/mysql-rsa"]
memory = []
replay-version-test = ["duroxide/replay-version-test"]

[dependencies]
async-trait = "0.1"
duroxide = { version = "0.1.32", default-features = false }
rand = "0.9"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "chrono"] }
thiserror = "2.0"
tokio = { version = "1.40", default-features = false, features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "v7"] }

[dev-dependencies]
anyhow = "1.0"
duroxide = { version = "0.1.32", default-features = false, features = ["provider-test", "test-hooks"] }
futures = "0.3"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
