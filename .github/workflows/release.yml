name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Tag & Conformance
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: duroxide_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$TAG_VER" != "$CARGO_VER" ]; then
            echo "::error::Git tag ($GITHUB_REF_NAME) does not match Cargo.toml version ($CARGO_VER)"
            exit 1
          fi

      - run: cargo fmt --all -- --check
      - run: cargo check --no-default-features --features memory
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --lib --all-features
      - run: cargo test --doc --all-features
      - run: cargo test --test memory_provider_validations --all-features
      - run: cargo package --locked

      - name: Run MySQL 8.0 conformance
        env:
          DUROXIDE_MYSQL_REQUIRE_DB: "1"
          DUROXIDE_MYSQL_TEST_URL: mysql://root:testpass@127.0.0.1:3306/duroxide_test
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -ptestpass -e "SET GLOBAL max_connections = 500;"
          cargo test --all-features --test provider_validations --test runtime_scenarios -- --test-threads=6

      - name: Run TiDB conformance
        env:
          DUROXIDE_MYSQL_REQUIRE_DB: "1"
          DUROXIDE_MYSQL_TEST_URL: mysql://root@127.0.0.1:4000/duroxide_test
        run: |
          docker run -d --name tidb -p 127.0.0.1:4000:4000 pingcap/tidb:v8.5.3
          for i in $(seq 1 60); do
            if mysql -h 127.0.0.1 -P 4000 -uroot -e "CREATE DATABASE IF NOT EXISTS duroxide_test;" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cargo test --all-features --test provider_validations --test runtime_scenarios -- --test-threads=6

  publish:
    name: Publish to crates.io & GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Uses zero-secret OIDC Trusted Publishing once configured on crates.io,
      # and falls back to secrets.CRATES_IO_TOKEN for the initial v0.1.0 bootstrap.
      - name: Authenticate via crates.io Trusted Publishing (OIDC)
        id: oidc_auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate to crates.io
        env:
          OIDC_TOKEN: ${{ steps.oidc_auth.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          TOKEN="${OIDC_TOKEN:-$FALLBACK_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "::error::Neither crates.io Trusted Publishing OIDC nor secrets.CRATES_IO_TOKEN yielded a token."
            exit 1
          fi
          CARGO_REGISTRY_TOKEN="$TOKEN" cargo publish --locked

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
