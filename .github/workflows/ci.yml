name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-unit:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --no-default-features --features memory
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --lib --all-features
      - run: cargo test --doc --all-features
      - run: cargo test --test memory_provider_validations --all-features

  mysql-conformance:
    name: MySQL 8.0 Conformance
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: duroxide_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Increase MySQL max_connections
        run: mysql -h 127.0.0.1 -P 3306 -uroot -ptestpass -e "SET GLOBAL max_connections = 500;"
      - name: Run Duroxide provider validation & scenario suite
        env:
          DUROXIDE_MYSQL_REQUIRE_DB: "1"
          DUROXIDE_MYSQL_TEST_URL: mysql://root:testpass@127.0.0.1:3306/duroxide_test
        run: cargo test --all-features --test provider_validations --test runtime_scenarios -- --test-threads=6

  tidb-conformance:
    name: TiDB Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start TiDB container
        run: |
          docker run -d --name tidb -p 127.0.0.1:4000:4000 pingcap/tidb:v8.5.3
          for i in $(seq 1 60); do
            if mysql -h 127.0.0.1 -P 4000 -uroot -e "CREATE DATABASE IF NOT EXISTS duroxide_test;" 2>/dev/null; then
              echo "TiDB ready"
              break
            fi
            sleep 1
          done
      - name: Run Duroxide provider validation & scenario suite
        env:
          DUROXIDE_MYSQL_REQUIRE_DB: "1"
          DUROXIDE_MYSQL_TEST_URL: mysql://root@127.0.0.1:4000/duroxide_test
        run: cargo test --all-features --test provider_validations --test runtime_scenarios -- --test-threads=6
